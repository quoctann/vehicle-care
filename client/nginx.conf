server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # TODO: add /api prefix to separate the SPA from the backend API

    # Same-origin reverse proxy to the backend Service, so the browser never
    # needs CORS — client/src/api/config.ts already defaults
    # VITE_API_BASE_URL to '/' for exactly this setup. The backend router has no
    # shared "/api" prefix (see server/internal/adapters/httpapi/server.go),
    # so each top-level route group gets its own location block instead of
    # one catch-all proxy.
    location /auth/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /devices/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sync/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the SPA (react-router with BrowserRouter, so
    # unknown paths must fall back to index.html instead of 404ing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
