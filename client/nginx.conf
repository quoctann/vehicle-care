server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Intra-pod healthcheck used by Kubernetes readiness/liveness probes.
    # This is handled by nginx itself and intentionally does not proxy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Deployment topology: same-origin frontend proxy.
    #
    # The browser always talks to one public application origin, e.g.
    # https://app.example.com. In production VITE_API_BASE_URL is left empty
    # (see client/src/api/config.ts), so all fetch() calls stay same-origin.
    # The frontend nginx proxies selected top-level paths to the backend
    # Kubernetes Service, which stays ClusterIP and has no public
    # Ingress/LoadBalancer/NodePort of its own.
    #
    # Why this matters:
    #   - Session (sid) and CSRF (csrf_token) cookies are scoped to the
    #     public application origin with SameSite=Lax.
    #   - No CORS preflights for normal API traffic.
    #   - The Google OAuth callback is a browser redirect, so it must remain
    #     on the same public origin for the backend to set cookies before
    #     redirecting back to the SPA.
    #
    # See also:
    #   - client/src/api/config.ts (VITE_API_BASE_URL)
    #   - server/internal/platform/config/config.go (FRONTEND_ORIGIN, FRONTEND_REDIRECT_URL, GOOGLE_REDIRECT_URL, ...)
    #   - .docs/decision.md §8 "Cấu hình Google Auth Platform"

    # Google OAuth callback: browser redirect carrying ?code=...&state=...
    # These values must never be written to any log. This location disables
    # nginx access and error logging; the outer Ingress/load balancer/CDN must
    # also redact or disable query logging for this exact path.
    location = /auth/google/callback {
        access_log off;
        error_log /dev/null;
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public auth endpoints and authenticated session/status routes.
    location /auth/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account settings (timezone, ...).
    location /account/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Device registration.
    location /devices/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Data sync push/pull.
    location /sync/ {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Part-type catalog: registered at GET /part-types (no trailing slash).
    # An exact match is required because a "/part-types/" location would not
    # proxy the registered endpoint.
    location = /part-types {
        proxy_pass http://vehicle-care-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker script must always be revalidated so worker updates
    # (including navigateFallbackDenylist fixes in vite.config.ts) reach
    # clients promptly. Without an explicit origin header, CDNs such as
    # Cloudflare apply their own multi-hour browser-cache TTL to sw.js and
    # delay update checks.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the SPA (react-router with BrowserRouter, so
    # unknown paths must fall back to index.html instead of 404ing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
