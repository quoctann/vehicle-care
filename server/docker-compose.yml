services:
  lgtm:
    image: grafana/otel-lgtm:0.29.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - vehicle_lgtm_data:/data
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/vehicle-care.yaml:ro
      - ./observability/dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/vehicle-care/api.json:ro

  alloy:
    image: grafana/alloy:v1.14.0
    profiles: [observability]
    environment:
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-vehicle-care-api}
      APP_ENV: ${APP_ENV:-development}
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./.logs:/logs:ro
      - vehicle_alloy_data:/var/lib/alloy/data
    depends_on: [lgtm]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicle_care
    ports:
      - "5432:5432"
    volumes:
      - vehicle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicle_care"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Dev only: persistence disabled so the container starts fast; losing
    # data on restart is fine locally. Production should enable AOF
    # (appendfsync everysec) — see the plan doc's "Rủi ro còn lại" section.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vehicle_lgtm_data:
  vehicle_alloy_data:
  vehicle_postgres_data:
