version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapters/postgres/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
            nullable: false
          - db_type: "uuid"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "jsonb"
            go_type:
              type: "byte"
              slice: true
            nullable: false
          - db_type: "jsonb"
            go_type:
              type: "byte"
              slice: true
            nullable: true
